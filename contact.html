<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contactez-moi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

  body {
    margin: 0;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    background-image: url('images/imageAccueil7.jpg');
    background-repeat: no-repeat;
    background-size: cover;
    background-position: top center;
     background-attachment: fixed; 
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
  }

  .contact-card {
    background: linear-gradient(135deg, #667eea, #764ba2);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 40px 50px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    max-width: 380px;
    width: 90%;
    text-align: center;
  }

  .contact-card h1 {
    margin-bottom: 30px;
    font-weight: 600;
    font-size: 2.2rem;
  }

  .contact-item {
    display: flex;
    align-items: center;
    margin: 20px 0;
    font-size: 1.25rem;
    cursor: default;
  }

  .contact-item svg {
    width: 28px;
    height: 28px;
    margin-right: 15px;
    flex-shrink: 0;
    fill: #fff;
  }

  .contact-item a {
    color: #fff;
    text-decoration: none;
    transition: color 0.3s ease;
  }
  .contact-item a:hover {
    color: #ffd166;
  }

.retour {
  position: fixed;
  top: 20px;      /* un peu d'espace du haut */
  left: 20px;     /* un peu d'espace de la gauche */
  z-index: 1000;  /* au-dessus de tout */
  margin: 0;      /* annule la marge verticale */
  text-align: left;
}

.retour a {
  display: inline-block;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 12px 28px;
  border-radius: 30px;
  font-weight: 600;
  text-decoration: none;
  font-family: 'Poppins', sans-serif;
  box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
  transition: background-color 0.3s ease, transform 0.2s ease;
  user-select: none;
}

.retour a:hover {
  background-color: #0056b3;
  transform: scale(1.05);
}

.retour a:active {
  transform: scale(0.95);
}

.logo img {
  max-width: 200px;   
  height: auto;       
  display: block;
  margin: 0 auto 25px; 
  
}

.linkedin-link {
  display: inline-flex;
  align-items: center;
  gap: 8px; /* espace entre icône et texte */
  color: #0A66C2; 
  font-weight: 600;
  font-family: 'Poppins', sans-serif;
  text-decoration: none;
  transition: color 0.3s ease;
  cursor: pointer;
}

.linkedin-link svg {
  width: 24px;
  height: 24px;
  fill: #0A66C2;
  flex-shrink: 0;
  transition: fill 0.3s ease;
}

.linkedin-link:hover {
  color: #004182;
}

.linkedin-link:hover svg {
  fill: #004182;
}


/* Petits écrans - smartphones */
@media (max-width: 480px) {
  body {
    padding: 20px;
    height: auto; 
  }

  .contact-card {
    padding: 30px 20px;
    max-width: 100%;
    width: 100%;
    box-shadow: none; 
    border-radius: 15px;
  }

  .contact-card h1 {
    font-size: 1.8rem;
    margin-bottom: 20px;
  }

  .contact-item {
    font-size: 1rem;
    margin: 15px 0;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .contact-item svg {
    width: 24px;
    height: 24px;
    margin-right: 0;
  }

  .contact-item a {
    font-size: 1rem;
  }

  .logo img {
    max-width: 150px;
    margin-bottom: 20px;
  }

  .retour a {
    padding: 10px 20px;
    font-size: 14px;
  }
}

/* Tablettes et petits PC */
@media (max-width: 768px) and (min-width: 481px) {
  .contact-card {
    max-width: 420px;
    width: 90%;
  }

  .contact-card h1 {
    font-size: 2rem;
  }

  .contact-item {
    font-size: 1.1rem;
  }

  .logo img {
    max-width: 180px;
  }
}

</style>
</head>
