<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page d'ouverture Portfolio DG</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    .splash-screen {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
      background-image: url('images/fond.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: top center;
    }

    .logo {
      width: 350px;
      height: auto;
      animation: zoomIn 2s ease-in-out;
    }

    .phrase {
      margin-top: 30px;
      max-width: 80%;
      text-align: center;
      font-size: 1.4rem;
      color: white;
      font-family: 'Courier New', Courier, monospace;
      border-right: 2px solid rgba(255,255,255,0.75);
      white-space: normal;
      overflow: hidden;
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(1);
      }
      to {
        opacity: 1;
        transform: scale(2);
      }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .blinking-cursor {
      animation: blink 0.75s step-end infinite;
    }
  </style>
</head>
<body>
  <div class="splash-screen">
    <img src="images/LogoboomDG.png" alt="Logo" class="logo" />
    <div class="phrase" id="typed-text"></div>
  </div>

  <script>
    window.addEventListener("load", () => {
      const phrase = "Comme un boomerang, je navigue entre code et design : je vais, je reviens, et je progresse à chaque boucle.";
      const typedText = document.getElementById("typed-text");

      let i = 0;

      setTimeout(() => {
        const interval = setInterval(() => {
          typedText.textContent = phrase.substring(0, i) + "|"; // simulate cursor
          i++;

          if (i > phrase.length) {
            clearInterval(interval);
            typedText.textContent = phrase; // remove cursor
            setTimeout(() => {
              window.location.href = "accueil.html";
            }, 1500); // 1.5s pause before redirect
          }
        }, 50); // typing speed (50ms per character)
      }, 2200); // delay after logo animation
    });
  </script>
</body>
</html>
