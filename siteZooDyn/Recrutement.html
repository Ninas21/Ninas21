<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Recrutement</title>
  <link rel="stylesheet" href="Recrutement.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />


<style> 

	/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to right, #4CAF50, #8B4513);
  color: #fff;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.recrutement-container {
  background-color: #fff;
  color: #333;
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
  width: 90%;
  max-width: 500px;
}

.recrutement-container h1 {
  margin-bottom: 20px;
  color: #4CAF50;
}

.recrutement-container p {
  font-size: 1rem;
  margin-bottom: 15px;
}

#mail a {
  display: inline-block;
  font-size: 1.1rem;
  color: #4CAF50;
  text-decoration: none;
  font-weight: bold;
  background-color: #f0f0f0;
  padding: 10px 18px;
  border-radius: 10px;
  transition: background 0.3s ease, color 0.3s ease;
}

#mail a:hover {
  background-color: #4CAF50;
  color: #fff;
}
</style>


</head>
<body>

  <main class="recrutement-container">
    <h1>Nos recrutements</h1>
    <p>Veuillez envoyer votre CV et lettre de motivation à l'adresse suivante :</p>
    <address id="mail">
      <a href="mailto:dreamzoo-recrutement@hotmail.com">dreamzoo-recrutement@hotmail.com</a>
    </address>
  </main>

</body>
</html>
