<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8"/>
	<title>Ma galerie</title>
	


<style> 
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  background: #f0f0f0;
  color: #222;
  text-align: center;
}

h3, h4 {
  margin-bottom: 10px;
}

.image-section {
  margin-bottom: 40px;
}

.images-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

.animal {
  width: 150px;
  height: 150px;
  overflow: hidden;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  cursor: pointer;
  transition: transform 0.3s ease;
}

.animal:hover {
  transform: scale(1.05);
}

.animal img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

</style>

</head>
<body>
	<h3>Ma galerie</h3>
	<h4>Les animaux les plus rares et qui sont en voie de disparition</h4>

	<section class="image-section">
		<div class="images-row">
			<div class="animal"><a href="Fichier3/ChatRare.jpg"><img src="Fichier3/ChatRare.jpg" alt="Chat rare" title="Chat rare" height="150" width="150"></a></div>
			<div class="animal"><a href="Fichier3/CoalaBlanc.jpg"><img src="Fichier3/CoalaBlanc.jpg" alt="Coala blanc" title="Coala blanc" height="150" width="150"></a></div>
			<div class="animal"><a href="Fichier3/Faon.jpg"><img src="Fichier3/Faon.jpg" alt="Faon rare" title="Faon rare" height="150" width="150"></a></div>
			<div class="animal"><a href="Fichier3/GazelleBizarre.jpeg"><img src="Fichier3/GazelleBizarre.jpeg" alt="Gazelle rare" title="Gazelle rare" height="150" width="150"></a></div>
			<div class="animal"><a href="Fichier3/GazelleBlanche.jpg"><img src="Fichier3/GazelleBlanche.jpg" alt="Gazelle blanche" title="Gazelle blanche" height="150" width="150"></a></div>
		</div>
	</section>

	<section class="image-section">
		<div class="images-row">
			<div class="animal"><a href="Fichier3/Grenouille.jpg"><img src="Fichier3/Grenouille.jpg" alt="Grenouille" title="Grenouille" height="150" width="150"></a></div>
			<div class="animal"><a href="Fichier3/LionBlanc.jpg"><img src="Fichier3/LionBlanc.jpg" alt="Lion blanc rare" title="Lion blanc rare" height="150" width="150"></a></div>
			<div class="animal"><a href="Fichier3/LionNoir.jpg"><img src="Fichier3/LionNoir.jpg" alt="Lion noir rare" title="Lion noir rare" height="150" width="150"></a></div>
			<div class="animal"><a href="Fichier3/SingeRare.jpg"><img src="Fichier3/SingeRare.jpg" alt="Singe rare" title="Singe rare" height="150" width="150"></a></div>
			<div class="animal"><a href="Fichier3/Ecureuil.jpg"><img src="Fichier3/Ecureuil.jpg" alt="Ecureuil coloré rare" title="Ecureuil coloré rare" height="150" width="150"></a></div>
		</div>
	</section>
</body>
</html>
