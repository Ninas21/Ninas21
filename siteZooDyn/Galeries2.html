.images-row {
  display: flex;

}

.animal {
  width: 150px;
  height: 150px;
  overflow: hidden;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  cursor: pointer;
  transition: transform 0.3s ease;
}

.animal:hover {
  transform: scale(1.05);
}

.animal img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
 
</style>
