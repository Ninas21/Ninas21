<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Actualités</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />


  <style> 
  	/* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background-color: #f9fafb;
  color: #333;
  line-height: 1.6;
}

/* Header */
.header {
  background: linear-gradient(to right, #4CAF50, #8B4513);
  color: white;
  text-align: center;
  padding: 60px 20px;
  border-bottom-left-radius: 40px;
  border-bottom-right-radius: 40px;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
}

.header h1 {
  font-size: 2.8rem;
  margin-bottom: 10px;
}

.header h3 {
  font-size: 1.2rem;
  font-weight: normal;
}

/* Container */
.container {
  width: 90%;
  max-width: 1200px;
  margin: 40px auto;
}

/* Section Title */
.videos-section h2 {
  font-size: 1.8rem;
  color: #4CAF50;
  margin-bottom: 30px;
  text-align: center;
}

/* Video Grid */
.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 25px;
}

.video-grid iframe {
  width: 100%;
  height: 220px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  border: none;
  transition: transform 0.3s ease;
}

.video-grid iframe:hover {
  transform: scale(1.03);
}
  </style>
</head>
<body>

  <header class="header">
    <h1>Nos actualités</h1>
    <h3>Suivez toutes nos actualités et nouveautés directement sur cette page.</h3>
  </header>

  <main class="container">
    <section class="videos-section">
      <h2>Vidéos de quelques animaux de notre zoo !</h2>
      <div class="video-grid">
        <iframe src="https://www.youtube.com/embed/xXJGMFuOeaw" title="YouTube video 1" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/u-OlD9kpd_k" title="YouTube video 2" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/dRWvNst5UF8" title="YouTube video 3" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/v8R_QTOgCi0" title="YouTube video 4" allowfullscreen></iframe>
      </div>
    </section>
  </main>

</body>
</html>
