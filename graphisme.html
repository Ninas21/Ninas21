<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projets de graphisme</title>
    <link rel="stylesheet" href="style.css">
</head>

<style>
    /* Appliquer une mise en page centrée */
    .container {
        display: flex;
        justify-content: center; 
        align-items: center;
        flex-direction: column; 
        height: 100vh; 
    }

    .project-card {
        text-align: center; /* Centrer le texte dans la carte */
        background-color: #f4f4f4; /* Couleur de fond pour la carte */
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Ombre autour de la carte */
        margin: 20px;
        width: 80%; /* Ajuste la largeur selon tes besoins */
        height: 80%;
        max-width: 700px; /* Limite la largeur à 500px */
    }

    h2 {
        font-family: 'Poppins', sans-serif;
        text-align: center;
        margin-bottom: 30px;
    }

    .project-cards {
        font-family: 'Poppins', sans-serif;
        display: flex;
        flex-wrap: wrap;
        justify-content: center; 
    }

    .project-card h3 {
        font-family: 'Poppins', sans-serif;
        font-size: 1.5em;
        margin-bottom: 10px;
        color: #2c3e50;
    }

    .project-card p {
        margin-bottom: 20px;
       color: #2c3e50;
        font-size: 20px;
    }

    .btn {
        background: #662D91; 
        color: #2c3e50; 
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        text-decoration: none;
        margin: 5px;
        font-size: 16px;
        transition: background-color 0.3s;
    }

    .btn:hover {
        background: linear-gradient(145deg, #ffffff, #dcdcdc); 
        color: #2c3e50; 
    }

    /* Logo */
.illus img {
    height: 200px;
    width: 200px;
    margin-left: 50px;
    animation: flip 4s ease-in-out infinite; /* Retour et rotation continue */
}
@keyframes flip {
    0% {
        transform: rotateY(0deg); /* Position initiale */
    }
    50% {
        transform: rotateY(180deg); /* Retournement à 180 degrés */
    }
    100% {
        transform: rotateY(360deg); /* Retour à la position initiale */
    }
}



/* Petits écrans (tablettes et smartphones) */
@media screen and (max-width: 768px) {
    .container {
        padding: 20px;
        height: auto;
    }

    .project-card {
        width: 90%;
        margin: 15px 0;
    }

    .btn {
        font-size: 14px;
        padding: 8px 12px;
    }

    h2 {
        font-size: 20px;
    }

    .project-card h3 {
        font-size: 18px;
    }

    .project-card p {
        font-size: 16px;
    }

    .illus img {
        width: 150px;
        height: 150px;
        margin-left: 0;
    }
}

/* Très petits écrans (ex : iPhone SE, 375px) */
@media screen and (max-width: 400px) {
    .project-card {
        padding: 15px;
    }

    .btn {
        display: block;
        width: 100%;
        margin: 8px 0;
        text-align: center;
    }

    h2 {
        font-size: 18px;
    }

    .project-card p {
        font-size: 14px;
    }
}
</style>

<body>

 <a href="accueil.html#graphisme" class="btn">Retour</a>
 



<section id="projects" class="section projects">
    <div class="container">
        <div class="illus">
            <img src="images/ai.png" height="200px" width="200px" alt="LogoAi" title="Illustrator">
        </div>
        <h2>Mes projets de "Illustrator"</h2>
        <div class="project-cards">
            <div class="project-card">
                <h3>Illustrator</h3>
                <p>Des petites réalisations avec illustrator</p>
                <a href="illustrator/BEDIA-Nasrine-EX1.pdf" class="btn">Ouvrir le projet 1</a>
                <a href="illustrator/BEDIA-Nasrine-Ex2.pdf" class="btn">Ouvrir le projet 2</a>
                <a href="illustrator/BEDIA-Nasrine-EX3.pdf" class="btn">Ouvrir le projet 3</a>
                <a href="illustrator/BEDIA-Nasrine-EX4.pdf" class="btn">Ouvrir le projet 4</a>
                <a href="illustrator/BEDIA-Nasrine-Final.pdf" class="btn">Ouvrir le projet 5</a>
            </div>
        </div>
    </div>
</section>

</body>
</html>
