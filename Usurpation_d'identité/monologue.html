<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Identity - Monologue</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: black;
      color: white;
      font-family: 'Press Start 2P', cursive;
      text-align: center;
      overflow: hidden;
      margin: 0;
      cursor: pointer;
    }

    .cinematic {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #startGameBtn {
      display: none;
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.15);
      border: 2px solid white;
      color: white;
      font-size: 14px;
      padding: 12px 20px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: 0.3s ease;
      z-index: 10;
    }

    #startGameBtn:hover {
      background: white;
      color: black;
    }
  </style>
</head>
<body>

  <div class="cinematic">
    <video id="introVideo" playsinline>
      <source src="video/elodie2.mp4" type="video/mp4">
      
    </video>

    <button id="startGameBtn">Commencer le jeu</button>
  </div>

  <script>
    const video = document.getElementById("introVideo");
    const startGameBtn = document.getElementById("startGameBtn");

    // Démarrer la vidéo avec son dès le premier clic
    document.body.addEventListener("click", function startVideo() {
      video.play();
      document.body.removeEventListener("click", startVideo);
    });

    // Afficher le bouton à la fin de la vidéo
    video.addEventListener("ended", () => {
      startGameBtn.style.display = "block";
    });

    // Bouton pour commencer le jeu
    startGameBtn.addEventListener("click", () => {
      window.location.href = "game.html";
    });
  </script>

</body>
</html>
</html>
